<!DOCTYPE html>
<html>
<head>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 15px; color: #2c3e50; }
    h3 { margin-top: 0; color: #d35400; }
    .rez-item { background: #fdfefe; border: 1px solid #d5dbdb; border-radius: 6px; padding: 12px; margin-bottom: 15px; }
    textarea { width: 95%; height: 45px; margin-top: 8px; border: 1px solid #bdc3c7; border-radius: 4px; padding: 5px; font-family: inherit; }
    button { background: #e74c3c; color: white; padding: 10px 18px; border: none; cursor: pointer; border-radius: 4px; font-weight: bold; }
    button:hover { background: #c0392b; }
    button.cancel { background: #95a5a6; margin-left: 10px; }
    button.cancel:hover { background: #7f8c8d; }
    .btn-container { text-align: right; margin-top: 20px; border-top: 1px solid #eee; padding-top: 15px; }
  </style>
</head>
<body>
  <h3>⚠️ Konflikt časov a rezervácií!</h3>
  <p>Tieto rezervácie kolidujú s tvojimi novými časmi. Môžeš im zadať dôvod a hromadne ich zrušiť (zákazníkom bude automaticky odoslaný e-mail), alebo ich vyriešiš ináč.</p>
  
  <div id="list"></div>
  
  <div class="btn-container">
    <button id="submitBtn" onclick="submit()">Zrušiť vybrané a odoslať e-maily</button>
    <button class="cancel" onclick="google.script.host.close()">Zatvoriť bez zmien</button>
  </div>

  <script>
    // meno/dátum/čas pochádzajú z riadkov v Google Sheete, ktoré v konečnom dôsledku vypĺňa
    // ktokoľvek cez verejný objednávkový formulár - preto ich pred vložením do innerHTML escapujeme.
    function escapeHtml(str) {
      return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }

    // POZOR - toto NIE JE JSON.parse(reťazec)! <?!= konflikty ?> vloží priamo pole objektov ako
    // JS literál (jsonForScript v .gs len ošetrí "<"/">"/"&", aby sa to nepobilo s okolitým <script> tagom).
    // Predtým tu bolo JSON.parse(<?= konflikty ?>) - to by ale vždy spadlo s chybou, lebo JSON.parse
    // dostal rovno pole/objekt (nie textový reťazec), a taký vstup vždy zlyhá s "[object Object] is not valid JSON".
    let konflikty = <?!= konflikty ?>;
    let listDiv = document.getElementById('list');

    konflikty.forEach((k, index) => {
       listDiv.innerHTML += `
         <div class="rez-item">
           <label><input type="checkbox" id="check-${index}" checked> <b>${escapeHtml(k.datum)} o ${escapeHtml(k.cas)}</b> - ${escapeHtml(k.meno)}</label>
           <textarea id="reason-${index}" placeholder="Dôvod (napr. Máš dovolenku, zmena otváracích hodín...)"></textarea>
         </div>
       `;
    });

    function submit() {
       let toCancel = [];
       konflikty.forEach((k, index) => {
          if (document.getElementById(`check-${index}`).checked) {
             k.dovod = document.getElementById(`reason-${index}`).value || "Neočakávané prevádzkové dôvody (zmena otváracích hodín).";
             toCancel.push(k);
          }
       });

       if(toCancel.length > 0) {
          let btn = document.getElementById('submitBtn');
          btn.innerText = "Odosielam...";
          btn.disabled = true;
          // Pošleme to do backendu a zatvoríme
          google.script.run.withSuccessHandler(() => {
             google.script.host.close();
          }).processCancellations(toCancel);
       } else {
          google.script.host.close();
       }
    }
  </script>
</body>
</html>
