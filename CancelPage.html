<!DOCTYPE html>
<html lang="sk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zrušenie termínu | Barbar Shop</title>
  <style>
    <?!= fontFaceCss ?>
    body {
      font-family: 'Roboto', 'Segoe UI', Helvetica, Arial, sans-serif;
      background-color: #1a1a1a;
      color: #e0e0e0;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .card {
      background-color: #2b1d16;
      border: 1px solid #f0c419;
      border-radius: 12px;
      padding: 40px;
      max-width: 450px;
      width: 100%;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      text-align: center;
    }
    h2 {
      color: #f0c419;
      margin-top: 0;
    }
    .details {
      background-color: #1a1a1a;
      padding: 15px;
      border-radius: 6px;
      margin-bottom: 25px;
      text-align: left;
      font-size: 15px;
      border-left: 4px solid #f0c419;
    }
    .details b { color: #f0c419; }
    textarea {
      width: 100%;
      background-color: #1a1a1a;
      border: 1px solid #444;
      color: #fff;
      padding: 15px;
      border-radius: 6px;
      font-family: inherit;
      resize: vertical;
      min-height: 100px;
      box-sizing: border-box;
      margin-bottom: 20px;
    }
    textarea:focus {
      outline: none;
      border-color: #f0c419;
    }
    .btn {
      background-color: #d32f2f;
      color: white;
      border: none;
      padding: 15px 25px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      width: 100%;
      transition: background-color 0.3s;
    }
    .btn:hover { background-color: #b71c1c; }
    .btn-change {
      display: block;
      box-sizing: border-box;
      width: 100%;
      padding: 15px 25px;
      background-color: #f0c419;
      color: #1a1a1a;
      font-size: 16px;
      font-weight: bold;
      text-decoration: none;
      border-radius: 6px;
      transition: background-color 0.3s;
    }
    .btn-change:hover { background-color: #d9b016; }
    .or { margin: 18px 0 14px 0; font-size: 14px; color: #aaa; }
    <?!= busyCss ?>
  </style>
</head>
<body>
  <div class="card">
    <? const mozeZmenu = (typeof zmenaUrl !== 'undefined' && zmenaUrl); ?>
    <h2><?= mozeZmenu ? 'Čo chceš s termínom?' : 'Naozaj chceš zrušiť termín?' ?></h2>
    
    <div class="details">
      <b>Bojovník:</b> <?= meno ?><br>
      <b>Dátum:</b> <?= datum ?> o <?= cas ?>
    </div>

    <? if (mozeZmenu) { ?>
    <a class="btn-change" href="<?= zmenaUrl ?>" target="_top">ZMENIŤ TERMÍN (vybrať iný čas)</a>
    <p class="or">alebo termín zruš:</p>
    <? } ?>

    <form method="GET" action="<?= scriptUrl ?>" target="_top">
      <input type="hidden" name="action" value="executeCancel">
      <input type="hidden" name="id" value="<?= id ?>">
      <input type="hidden" name="role" value="<?= role ?>">
      
      <textarea name="dovod" placeholder="Zadaj dôvod zrušenia (nepovinné)..."></textarea>
      
      <button type="submit" class="btn" data-busy="RUŠÍM TERMÍN...">ÁNO, ZRUŠIŤ TERMÍN</button>
    </form>
  </div>
  <script><?!= busyJs ?></script>
</body>
</html>
